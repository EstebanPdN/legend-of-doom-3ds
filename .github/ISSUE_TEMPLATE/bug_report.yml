name: Bug report
description: Report a problem with Legend of Doom 3DS
title: "[Bug] "
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem with Legend of Doom 3DS. Please search existing issues first and identify the exact release and console used. Hardware validation targets the New Nintendo 3DS family; emulator results do not establish physical-console compatibility or performance.

  - type: input
    id: version
    attributes:
      label: Port version
      placeholder: "v1.0 (include the build ID/profile from BUILD-MANIFEST.txt for a source build)"
    validations:
      required: true

  - type: dropdown
    id: hardware
    attributes:
      label: System
      options:
        - New Nintendo 3DS
        - New Nintendo 3DS XL
        - New Nintendo 2DS XL
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Installation
      options:
        - CIA
        - Homebrew Launcher 3DSX
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Explain the problem and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the game
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: Diagnostic files
      description: Press L + R + A while the issue is visible and attach the complete quick diagnostic folder from sdmc:/3ds/legend-of-doom/dumps/. For updater errors, also include sdmc:/3ds/legend-of-doom/update.log. Review full memory dumps before sharing them; do not attach ROMs or commercial IWADs.

  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Include any setting changes or other details that may help reproduce the problem.
