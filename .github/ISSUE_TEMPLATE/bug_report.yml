name: Bug report
description: Report a problem with Legend of Doom 3DS
title: "[Bug] "
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing the hardware bring-up build. Please search existing issues before opening a new one. Emulator-only reports are currently outside the validation scope.

  - type: input
    id: version
    attributes:
      label: Port version
      placeholder: "v0.1-hardware-diagnostic-<build-id>"
    validations:
      required: true

  - type: dropdown
    id: hardware
    attributes:
      label: System
      options:
        - New Nintendo 3DS
        - New Nintendo 3DS XL
        - New Nintendo 2DS XL
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Installation
      options:
        - CIA
        - Homebrew Launcher 3DSX
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Explain the problem and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the game
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: Diagnostic files
      description: Attach gpu-diagnostic.log, novagl-stage.log, startup.log and novagl.log when available. Never upload a ROM, commercial IWAD or full memory dump without reviewing its contents.

  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Include any setting changes or other details that may help reproduce the problem.
