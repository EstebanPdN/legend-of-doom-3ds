name: Feature request
description: Suggest an improvement for the Nintendo 3DS port
title: "[Feature] "
labels: [enhancement]

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What would this change improve for Nintendo 3DS players?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior you would like.
    validations:
      required: true

  - type: dropdown
    id: hardware
    attributes:
      label: Target hardware
      options:
        - Both Old and New Nintendo 3DS families
        - Old Nintendo 3DS family
        - New Nintendo 3DS family
        - Not hardware-specific
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or examples
      description: Add screenshots, mockups, or links that clarify the idea. Never upload copyrighted game data.
